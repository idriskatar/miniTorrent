[package]
name = "minitorrent"
version = "0.3.0"
edition = "2021"

[dependencies]
# Dokümantasyonla doğrulanmış sürüme sabitlendi
librqbit = "=8.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
eframe = "0.29"
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
